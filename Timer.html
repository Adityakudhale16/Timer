<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Aditya Kudhale</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
    color:white;
}

.container{
    text-align:center;
    padding:60px 20px;
}

.logo{
    font-size:2.5rem;
    font-weight:700;
    margin-bottom:20px;
    color:#38bdf8;
}

.subtitle{
    opacity:0.8;
    margin-bottom:40px;
}

.timer{
    font-size:5rem;
    font-weight:bold;
    margin:30px 0;
    text-shadow:0 0 20px rgba(56,189,248,0.7);
}

.controls button{
    padding:12px 25px;
    margin:10px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    font-size:1rem;
    transition:0.3s;
}

.start{
    background:#22c55e;
    color:white;
}

.pause{
    background:#f59e0b;
    color:white;
}

.reset{
    background:#ef4444;
    color:white;
}

.controls button:hover{
    transform:translateY(-3px);
    opacity:0.9;
}

.glow-card{
    width:320px;
    margin:auto;
    padding:30px;
    border-radius:20px;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    box-shadow:0 0 25px rgba(0,0,0,0.3);
}

footer{
    text-align:center;
    padding:20px;
    background:rgba(0,0,0,0.25);
    border-top:1px solid rgba(255,255,255,0.1);
}

footer p{
    opacity:0.8;
    font-size:0.9rem;
}

footer a{
    color:#38bdf8;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="container">
    <div class="logo">⏳ MR ADITYA </div>
    <p class="subtitle">A futuristic online timer experience</p>

    <div class="glow-card">
        <div class="timer" id="timer">00:00</div>

        <div class="controls">
            <button class="start" onclick="startTimer()">Start</button>
            <button class="pause" onclick="pauseTimer()">Pause</button>
            <button class="reset" onclick="resetTimer()">Reset</button>
        </div>
    </div>
</div>

<footer>
    <p>
        © 2026 NeoTimer | Designed with Aditya Kudhale
    </p>
</footer>

<script>
let seconds = 0;
let interval = null;

function updateDisplay() {
    const mins = String(Math.floor(seconds / 60)).padStart(2,'0');
    const secs = String(seconds % 60).padStart(2,'0');
    document.getElementById('timer').textContent = `${mins}:${secs}`;
}

function startTimer() {
    if(interval) return;
    interval = setInterval(() => {
        seconds++;
        updateDisplay();
    }, 1000);
}

function pauseTimer() {
    clearInterval(interval);
    interval = null;
}

function resetTimer() {
    pauseTimer();
    seconds = 0;
    updateDisplay();
}
</script>

</body>
</html>
